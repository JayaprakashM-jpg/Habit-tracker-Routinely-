<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routinely</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:-apple-system,system-ui,sans-serif;
            background:linear-gradient(135deg,#2c3e50,#3498db);
            min-height:100vh;
            padding:20px;
        }
        .container{
            max-width:800px;
            margin:0 auto;
        }
        .header{
            background:white;
            border-radius:20px;
            padding:30px;
            margin-bottom:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            background:linear-gradient(135deg,#667eea,#764ba2);
            color:white;
        }
        .header h1{
            text-align:center;
            margin-bottom:10px;
            font-size:28px;
            font-weight:600;
            text-shadow:2px 2px 4px rgba(0,0,0,0.2);
        }
        .header .sub{
            text-align:center;
            font-size:14px;
            opacity:0.9;
        }
        .add-btn{
            width:100%;
            padding:15px;
            background:white;
            color:#667eea;
            border:none;
            border-radius:10px;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            margin-top:15px;
            transition:0.2s;
        }
        .add-btn:hover{
            transform:scale(1.02);
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }
        
        /* Habits Section - Full width */
        .habits-section{
            background:white;
            border-radius:20px;
            padding:25px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }
        h2{margin-bottom:20px;color:#333;}
        
        .habit-list{list-style:none;}
        .habit-item{
            background:#f8f9fa;
            border-radius:10px;
            margin-bottom:10px;
            border:2px solid transparent;
            transition:0.2s;
        }
        .habit-item.selected{
            border-color:#667eea;
        }
        .habit-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px;
            cursor:pointer;
        }
        .habit-header:hover{background:#e9ecef; border-radius:8px;}
        .habit-name{
            font-weight:600;
            font-size:16px;
        }
        .habit-details{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .badge{
            padding:4px 10px;
            border-radius:20px;
            font-size:12px;
            font-weight:600;
        }
        .streak{background:#ed8936;color:white;}
        .schedule{background:#667eea20;color:#667eea;}
        .rest{background:#9f7aea20;color:#9f7aea;}
        .reminder{background:#48bb7820;color:#48bb78;}
        .reminder-time{
            font-size:10px;
            margin-left:2px;
            opacity:0.8;
        }
        
        .habit-actions{
            display:flex;
            gap:8px;
        }
        .edit,.delete,.mark-done{
            padding:6px 12px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:13px;
            font-weight:500;
            transition:0.2s;
        }
        .edit{background:#48bb78;color:white;}
        .edit:hover{background:#3c9e5e;}
        .delete{background:#f56565;color:white;}
        .delete:hover{background:#d64545;}
        .mark-done{background:#667eea;color:white;}
        .mark-done.completed{background:#48bb78;}
        .mark-done:hover{transform:scale(1.05);}
        
        /* Calendar Dropdown - Split View */
        .calendar-dropdown{
            background:#f0f2f5;
            border-radius:0 0 10px 10px;
            padding:20px;
            border-top:2px solid #667eea;
            display:none;
        }
        .calendar-dropdown.show{display:block;}
        
        .dropdown-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:15px;
            color:#667eea;
            font-weight:600;
        }
        .close-dropdown{
            background:none;
            border:none;
            font-size:18px;
            cursor:pointer;
            color:#999;
        }
        .close-dropdown:hover{color:#333;}
        
        /* Chart Type Selector */
        .chart-selector{
            display:flex;
            gap:10px;
            margin-bottom:15px;
            justify-content:center;
        }
        .chart-option{
            padding:6px 16px;
            border:2px solid #667eea;
            border-radius:20px;
            font-size:13px;
            font-weight:600;
            cursor:pointer;
            color:#667eea;
            background:white;
            transition:0.2s;
        }
        .chart-option:hover{
            background:#667eea20;
        }
        .chart-option.active{
            background:#667eea;
            color:white;
        }
        
        /* Split View Layout */
        .split-view{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;
            margin-top:10px;
        }
        
        /* Left Side - Calendar (Smaller) */
        .calendar-side{
            background:white;
            border-radius:10px;
            padding:12px;
        }
        .calendar-grid{
            display:grid;
            grid-template-columns:repeat(7,1fr);
            gap:3px;
            margin:10px 0;
        }
        .calendar-day{
            aspect-ratio:1;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#f8f9fa;
            border-radius:6px;
            font-size:12px;
            font-weight:600;
            cursor:pointer;
            border:1px solid transparent;
            transition:0.2s;
            position:relative;
            color:#333;
        }
        .calendar-day.today{border-color:#667eea;background:#ebf4ff;}
        .calendar-day.completed{background:#48bb78;color:white;}
        .calendar-day.missed{background:#f56565;color:white;}
        .calendar-day.rest{background:#9f7aea;color:white;}
        .calendar-day.start-date{
            border:2px solid #fbbf24 !important;
        }
        .calendar-day.start-date.completed{
            background:#48bb78 !important;
            color:white !important;
            border:2px solid #fbbf24 !important;
        }
        .calendar-day.start-date.rest{
            background:#9f7aea !important;
            color:white !important;
            border:2px solid #fbbf24 !important;
        }
        .calendar-day.start-date.missed{
            background:#f8f9fa !important;
            color:#333 !important;
            border:2px solid #fbbf24 !important;
        }
        .calendar-day.disabled{
            opacity:0.5;
            cursor:not-allowed;
            background:#e0e0e0;
            color:#666;
        }
        .calendar-day.disabled:hover{transform:none;}
        .calendar-day:hover:not(.disabled){transform:scale(1.05);}
        
        .weekdays{
            display:grid;
            grid-template-columns:repeat(7,1fr);
            gap:3px;
            text-align:center;
            font-weight:600;
            color:#666;
            font-size:10px;
            margin-bottom:5px;
        }
        .month-nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin:8px 0;
        }
        .month-btn{
            background:#667eea;
            color:white;
            border:none;
            border-radius:4px;
            padding:3px 8px;
            cursor:pointer;
            font-size:11px;
            transition:0.2s;
        }
        .month-btn:hover{
            background:#5a67d8;
        }
        .month-title{
            font-size:12px;
            font-weight:600;
            color:#333;
        }
        
        /* Right Side - Charts */
        .charts-side{
            background:white;
            border-radius:10px;
            padding:12px;
        }
        .chart-container{
            height:180px;
            margin-bottom:5px;
            position:relative;
        }
        .chart-title{
            font-size:12px;
            font-weight:600;
            color:#666;
            margin-bottom:8px;
            text-align:center;
        }
        
        .dropdown-stats{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:8px;
            margin-top:10px;
        }
        .stat-card{
            background:white;
            padding:6px;
            border-radius:6px;
            text-align:center;
        }
        .stat-value{font-size:14px;font-weight:600;color:#667eea;}
        .stat-label{font-size:9px;color:#999;margin-top:2px;}
        
        .empty{text-align:center;color:#999;padding:40px;}
        
        /* Modal */
        .modal{
            display:none;
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.5);
            justify-content:center;
            align-items:center;
            z-index:1000;
            backdrop-filter:blur(3px);
        }
        .modal.active{display:flex;}
        .modal-content{
            background:white;
            border-radius:20px;
            padding:30px;
            width:90%;
            max-width:500px;
            max-height:90vh;
            overflow-y:auto;
            animation:modalIn 0.3s;
        }
        @keyframes modalIn{
            from{transform:scale(0.9);opacity:0;}
            to{transform:scale(1);opacity:1;}
        }
        .modal input,.modal select{
            width:100%;
            padding:12px;
            margin:5px 0 15px;
            border:2px solid #e0e0e0;
            border-radius:10px;
            font-size:15px;
            transition:0.2s;
        }
        .modal input:focus,.modal select:focus{
            outline:none;
            border-color:#667eea;
        }
        .modal-actions{
            display:flex;
            gap:10px;
            margin-top:20px;
        }
        .modal-actions button{
            flex:1;
            padding:12px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:600;
            transition:0.2s;
        }
        .save{background:#667eea;color:white;}
        .save:hover{background:#5a67d8;}
        .cancel{background:#e0e0e0;color:#666;}
        .cancel:hover{background:#d0d0d0;}
        
        .radio-group{
            display:flex;
            gap:10px;
            margin:10px 0;
        }
        .radio-group label{
            flex:1;
            text-align:center;
            padding:10px;
            background:#f8f9fa;
            border:2px solid #e0e0e0;
            border-radius:8px;
            cursor:pointer;
            transition:0.2s;
        }
        .radio-group label:hover{
            background:#e9ecef;
        }
        .radio-group input{display:none;}
        .radio-group input:checked+label{
            background:#667eea;
            color:white;
            border-color:#667eea;
        }
        
        .day-selector{
            display:grid;
            grid-template-columns:repeat(7,1fr);
            gap:5px;
            margin:15px 0;
            max-height:200px;
            overflow-y:auto;
        }
        .day-selector div{
            display:flex;
            flex-direction:column;
            align-items:center;
            font-size:12px;
        }
        .day-selector input[type="checkbox"]{
            width:18px;
            height:18px;
            cursor:pointer;
            margin:0;
        }
        
        /* Rest Days Section - Custom Days */
        .rest-section{
            background:#f8f9fa;
            border-radius:10px;
            padding:15px;
            margin:15px 0;
        }
        .rest-type-selector{
            margin-bottom:15px;
        }
        .rest-type-selector select{
            width:100%;
            padding:10px;
            border:2px solid #e0e0e0;
            border-radius:8px;
            font-size:14px;
        }
        .custom-days-selector{
            margin-top:15px;
            padding-top:15px;
            border-top:2px dashed #e0e0e0;
        }
        .custom-days-selector h4{
            font-size:14px;
            color:#666;
            margin-bottom:10px;
        }
        .day-checkbox-group{
            display:grid;
            grid-template-columns:repeat(7,1fr);
            gap:8px;
            margin-bottom:10px;
        }
        .day-checkbox-item{
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:5px;
        }
        .day-checkbox-item input[type="checkbox"]{
            width:20px;
            height:20px;
            cursor:pointer;
        }
        .day-checkbox-item label{
            font-size:11px;
            font-weight:600;
            color:#666;
        }
        .rest-logic{
            background:#ebf4ff;
            padding:10px;
            border-radius:8px;
            font-size:13px;
            color:#667eea;
            margin-top:10px;
        }
        
        /* Reminder Section - Left Text, Right Toggle */
        .reminder-section{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin:15px 0;
            padding:10px;
            background:#f8f9fa;
            border-radius:10px;
        }
        .reminder-text{
            font-weight:600;
            color:#333;
        }
        .reminder-text small{
            font-weight:normal;
            font-size:11px;
            color:#666;
            display:block;
            margin-top:2px;
        }
        .reminder-toggle-switch{
            position:relative;
            display:inline-block;
            width:50px;
            height:24px;
        }
        .reminder-toggle-switch input{
            opacity:0;
            width:0;
            height:0;
        }
        .toggle-slider{
            position:absolute;
            cursor:pointer;
            top:0;
            left:0;
            right:0;
            bottom:0;
            background-color:#ccc;
            transition:.3s;
            border-radius:24px;
        }
        .toggle-slider:before{
            position:absolute;
            content:"";
            height:18px;
            width:18px;
            left:3px;
            bottom:3px;
            background-color:white;
            transition:.3s;
            border-radius:50%;
        }
        input:checked + .toggle-slider{
            background-color:#667eea;
        }
        input:checked + .toggle-slider:before{
            transform:translateX(26px);
        }
        
        /* Custom Time Picker - Any Minute */
        .time-picker-group{
            display:flex;
            gap:10px;
            align-items:center;
            margin:15px 0 10px;
        }
        .time-picker-group select{
            flex:1;
            padding:10px;
            border:2px solid #e0e0e0;
            border-radius:8px;
            font-size:14px;
            background:white;
        }
        .minute-selector{
            max-height:200px;
            overflow-y:auto;
        }
        .minute-selector option{
            padding:5px;
        }
        .reminder-note{
            font-size:11px;
            color:#666;
            margin-top:5px;
            font-style:italic;
            background:#ebf4ff;
            padding:8px;
            border-radius:6px;
        }
        
        .footer{text-align:center;margin-top:20px;color:rgba(255,255,255,0.8);}
        
        /* Custom Alert Popup */
        .alert-popup {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #f56565;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 2000;
            animation: slideDown 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .alert-popup.warning {
            background: #ed8936;
        }
        
        .alert-popup.success {
            background: #48bb78;
        }
        
        .alert-popup .close-alert {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 0 5px;
            opacity: 0.8;
        }
        
        .alert-popup .close-alert:hover {
            opacity: 1;
        }
        
        @keyframes slideDown {
            from {
                top: -50px;
                opacity: 0;
            }
            to {
                top: 20px;
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Routinely</h1>
            <div class="sub">track · build · maintain</div>
            <button class="add-btn" id="addBtn">+ Create New Habit</button>
        </div>

        <!-- Habits Section -->
        <div class="habits-section">
            <h2>Your Habits</h2>
            <div id="habitList" class="habit-list"></div>
        </div>
        
        <div class="footer">Routinely · small steps, big changes</div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle">New Habit</h3>
            <input type="text" id="habitName" placeholder="Habit name">
            
            <div class="radio-group">
                <input type="radio" name="schedule" id="daily" value="daily" checked><label for="daily">Daily</label>
                <input type="radio" name="schedule" id="weekly" value="weekly"><label for="weekly">Weekly</label>
                <input type="radio" name="schedule" id="monthly" value="monthly"><label for="monthly">Monthly</label>
            </div>

            <div id="weeklySelector" style="display:none">
                <div class="day-selector">
                    <div><input type="checkbox" id="sun" value="0"><label>Su</label></div>
                    <div><input type="checkbox" id="mon" value="1"><label>Mo</label></div>
                    <div><input type="checkbox" id="tue" value="2"><label>Tu</label></div>
                    <div><input type="checkbox" id="wed" value="3"><label>We</label></div>
                    <div><input type="checkbox" id="thu" value="4"><label>Th</label></div>
                    <div><input type="checkbox" id="fri" value="5"><label>Fr</label></div>
                    <div><input type="checkbox" id="sat" value="6"><label>Sa</label></div>
                </div>
            </div>

            <div id="monthlySelector" style="display:none">
                <div class="day-selector" id="monthDays"></div>
            </div>

            <!-- Rest Days Section with Custom Days -->
            <div class="rest-section">
                <div class="rest-type-selector">
                    <select id="restType">
                        <option value="none">No rest days</option>
                        <option value="weekends">Weekends only</option>
                        <option value="custom">Custom days</option>
                    </select>
                </div>
                
                <div id="customDaysSelector" class="custom-days-selector" style="display:none;">
                    <h4>Select rest days:</h4>
                    <div class="day-checkbox-group">
                        <div class="day-checkbox-item">
                            <input type="checkbox" id="restSun" value="0">
                            <label for="restSun">Sun</label>
                        </div>
                        <div class="day-checkbox-item">
                            <input type="checkbox" id="restMon" value="1">
                            <label for="restMon">Mon</label>
                        </div>
                        <div class="day-checkbox-item">
                            <input type="checkbox" id="restTue" value="2">
                            <label for="restTue">Tue</label>
                        </div>
                        <div class="day-checkbox-item">
                            <input type="checkbox" id="restWed" value="3">
                            <label for="restWed">Wed</label>
                        </div>
                        <div class="day-checkbox-item">
                            <input type="checkbox" id="restThu" value="4">
                            <label for="restThu">Thu</label>
                        </div>
                        <div class="day-checkbox-item">
                            <input type="checkbox" id="restFri" value="5">
                            <label for="restFri">Fri</label>
                        </div>
                        <div class="day-checkbox-item">
                            <input type="checkbox" id="restSat" value="6">
                            <label for="restSat">Sat</label>
                        </div>
                    </div>
                </div>
                
                <div class="rest-logic" id="restLogic"></div>
            </div>

            <!-- Reminder Section - Left Text, Right Toggle -->
            <div class="reminder-section">
                <div class="reminder-text">
                    🔔 Daily Reminder
                    <small>Get browser notifications</small>
                </div>
                <label class="reminder-toggle-switch">
                    <input type="checkbox" id="reminderToggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            
            <!-- Time Picker (shows when reminder enabled) -->
            <div id="reminderSettings" style="display:none;">
                <div class="time-picker-group">
                    <select id="reminderHour">
                        <option value="">Hour</option>
                        <option value="0">12 AM</option><option value="1">1 AM</option><option value="2">2 AM</option>
                        <option value="3">3 AM</option><option value="4">4 AM</option><option value="5">5 AM</option>
                        <option value="6">6 AM</option><option value="7">7 AM</option><option value="8">8 AM</option>
                        <option value="9">9 AM</option><option value="10">10 AM</option><option value="11">11 AM</option>
                        <option value="12">12 PM</option><option value="13">1 PM</option><option value="14">2 PM</option>
                        <option value="15">3 PM</option><option value="16">4 PM</option><option value="17">5 PM</option>
                        <option value="18">6 PM</option><option value="19">7 PM</option><option value="20">8 PM</option>
                        <option value="21">9 PM</option><option value="22">10 PM</option><option value="23">11 PM</option>
                    </select>
                    <select id="reminderMinute" class="minute-selector" size="1">
                        <option value="">Minute</option>
                        <!-- Will be populated by JavaScript with all minutes -->
                    </select>
                </div>
                <div class="reminder-note">
                    ⏰ You'll get a browser notification daily at this time
                </div>
            </div>

            <div class="modal-actions">
                <button class="cancel" id="cancelBtn">Cancel</button>
                <button class="save" id="saveBtn">Save</button>
            </div>
        </div>
    </div>

    <!-- Alert Popup (will be shown dynamically) -->
    <div id="alertPopup" class="alert-popup" style="display: none;">
        <span id="alertMessage"></span>
        <button class="close-alert" onclick="hideAlert()">×</button>
    </div>

    <script>
        // ==================== NOTIFICATION SETUP ====================
        
        // Request notification permission on load
        if (Notification.permission !== 'granted' && Notification.permission !== 'denied') {
            Notification.requestPermission();
        }

        // Store active timeouts for reminders
        let reminderTimeouts = {};

        // Format time for display
        function formatReminderTime(hour, minute) {
            if (hour === undefined || minute === undefined) return '';
            let period = hour >= 12 ? 'PM' : 'AM';
            let displayHour = hour % 12 || 12;
            return `${displayHour}:${minute.toString().padStart(2,'0')} ${period}`;
        }

        // Schedule reminder for a habit
        function scheduleReminder(habit) {
            // Clear existing reminder if any
            if (reminderTimeouts[habit.id]) {
                clearTimeout(reminderTimeouts[habit.id]);
            }

            if (!habit.reminder || habit.reminderHour === undefined || habit.reminderMinute === undefined) {
                return;
            }

            const now = new Date();
            const reminderTime = new Date();
            reminderTime.setHours(habit.reminderHour, habit.reminderMinute, 0, 0);

            // If time has passed today, schedule for tomorrow
            if (reminderTime <= now) {
                reminderTime.setDate(reminderTime.getDate() + 1);
            }

            const timeUntilReminder = reminderTime - now;

            reminderTimeouts[habit.id] = setTimeout(() => {
                // Check if habit was already completed today
                const today = new Date().toDateString();
                if (!habit.history?.[today]) {
                    // Show notification
                    new Notification('📋 Routinely Reminder', {
                        body: `Time to: ${habit.text}`,
                        icon: '📋',
                        silent: false,
                        tag: `habit-${habit.id}`,
                        requireInteraction: true
                    });

                    // Also log to console for debugging
                    console.log(`Reminder sent for: ${habit.text}`);
                }

                // Schedule next day's reminder
                scheduleReminder(habit);
            }, timeUntilReminder);

            console.log(`Reminder scheduled for ${habit.text} at ${formatReminderTime(habit.reminderHour, habit.reminderMinute)}`);
        }

        // Reschedule all reminders
        function rescheduleAllReminders() {
            // Clear all existing timeouts
            Object.values(reminderTimeouts).forEach(timeout => clearTimeout(timeout));
            reminderTimeouts = {};

            // Schedule for all habits with reminders
            habits.forEach(habit => {
                if (habit.reminder) {
                    scheduleReminder(habit);
                }
            });
        }

        // ==================== DUPLICATE CHECK FUNCTION ====================
        function isDuplicateHabit(habitName, editingId = null) {
            // Convert to lowercase for case-insensitive comparison
            const normalizedName = habitName.trim().toLowerCase();
            
            // Check if any existing habit has the same name (case-insensitive)
            return habits.some(habit => {
                // If we're editing, exclude the current habit from duplicate check
                if (editingId && habit.id === editingId) {
                    return false;
                }
                return habit.text.toLowerCase() === normalizedName;
            });
        }

        function isActive(habit, date){
            if(habit.schedule==='daily') return true;
            if(habit.schedule==='weekly') return habit.days.includes(date.getDay());
            if(habit.schedule==='monthly') return habit.days.includes(date.getDate());
            return true;
        }

        function isRestDay(habit, date){
            if(!habit.restDays) return false;
            
            if(habit.restDays.type === 'weekends') {
                return [0,6].includes(date.getDay());
            }
            
            if(habit.restDays.type === 'custom' && habit.restDays.customDays) {
                return habit.restDays.customDays.includes(date.getDay());
            }
            
            return false;
        }

        function updateStreak(habit){
            let streak = 0;
            let today = new Date();
            let checkDate = new Date(today);
            let startDate = habit.startDate ? new Date(habit.startDate) : new Date(2020,0,1);
            
            while(checkDate >= startDate){
                let key = dateStr(checkDate);
                
                if(isActive(habit, checkDate) && !isRestDay(habit, checkDate)){
                    if(habit.history?.[key]){
                        streak++;
                        checkDate.setDate(checkDate.getDate() - 1);
                    } else {
                        break;
                    }
                } else {
                    checkDate.setDate(checkDate.getDate() - 1);
                }
            }
            
            habit.streak = streak;
            return habit;
        }

        function toggleHabit(id, date){
            habits = habits.map(h => {
                if(h.id === id){
                    if(!h.history) h.history = {};
                    h.history[dateStr(date)] = !h.history[dateStr(date)];
                    return updateStreak(h);
                }
                return h;
            });
            save();
            renderHabits();
            if(openHabitId === id) renderHabitCalendar(id);
        }
